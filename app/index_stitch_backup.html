<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_14');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
varying vec2 v_texCoord;

// Simplex 2D noise
vec3 permute(vec3 x) { return mod(((x*34.0)+1.0)*x, 289.0); }
float snoise(vec2 v){
  const vec4 C = vec4(0.211324865405187, 0.366025403784439,
           -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1;
  i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 ))
  + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy),
    dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 uv = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    
    float d = length(uv);
    
    // Breathing pulse
    float pulse = sin(u_time * 1.5) * 0.05 + 1.0;
    float coreDist = d / pulse;
    
    // Internal energy noise
    float noise = snoise(uv * 3.0 + u_time * 0.4) * 0.1;
    
    // Main orb glow
    float orb = 0.08 / (coreDist - 0.4 + noise);
    orb *= smoothstep(0.7, 0.4, coreDist);
    
    // Concentric rings
    float ring1 = abs(sin(d * 12.0 - u_time * 2.0)) * 0.1;
    ring1 = 0.01 / (abs(d - 0.65 - ring1) + 0.02);
    
    float ring2 = 0.005 / (abs(d - 0.85) + 0.05);
    
    // Color palette (#00E5FF)
    vec3 cyan = vec3(0.0, 0.898, 1.0);
    
    // Combine layers
    vec3 color = cyan * (orb + ring1 + ring2 * 0.5);
    
    // Core highlight
    float center = smoothstep(0.2, 0.0, d);
    color += cyan * center * 0.8;

    // Atmospheric haze
    color += cyan * (0.05 / (d + 0.5)) * 0.3;

    gl_FragColor = vec4(color, color.r * 0.8);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- Javascript for Clock -->
<script>
        function updateClock() {
            const now = new Date();
            
            // Time
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock-time').textContent = `${hours}:${minutes}:${seconds}`;
            
            // Date
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
            const dayName = days[now.getDay()];
            
            document.getElementById('clock-date').textContent = `${dayName} // ${year}.${month}.${day}`;
        }
        
        setInterval(updateClock, 1000);
        updateClock(); // initial call
    </script>
<script>
(function(){
  var box=document.getElementById('box'), log=document.getElementById('log');
  var $=function(id){return document.getElementById(id);};
  function esc(t){ return (t||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function ln(cls,html){ var d=document.createElement('div'); d.className=cls; d.innerHTML=html; log.appendChild(d);
    while(log.children.length>8) log.removeChild(log.firstChild); log.scrollTop=log.scrollHeight; return d; }
  var you=function(t){return ln('font-label-caps text-label-caps text-outline tracking-widest','&gt; '+esc(t));},
      jv=function(t,e){return ln('font-body-md text-body-md '+(e?'text-error':'text-primary-fixed-dim glow-text'),esc(t));},
      act=function(t){return ln('font-label-caps text-[10px] text-primary-container/60 tracking-widest','&#8627; '+esc(t));};
  var busy=false;
  function submit(){ var t=box.value.trim(); if(!t||busy) return; box.value=''; you(t); busy=true;
    var think=ln('font-label-caps text-label-caps text-primary-container animate-pulse tracking-[0.3em]','PROCESSING...');
    window.pywebview.api.chat(t).then(function(r){ think.remove(); (r.activity||[]).forEach(act); jv(r.reply||'…'); busy=false; box.focus(); })
      .catch(function(e){ think.remove(); jv('A fault occurred, sir: '+e,true); busy=false; }); }
  box.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } });

  var cpuArc=$('cpu-arc'),cpuVal=$('cpu-val'),ramArc=$('ram-arc'),ramVal=$('ram-val'),
      diskVal=$('disk-val'),diskBar=$('disk-bar'),coresEl=$('cores'),
      spark=$('spark'),sctx=spark?spark.getContext('2d'):null,hist=[];
  function arc(el,pct){ if(el) el.setAttribute('stroke-dashoffset',(439*(1-pct/100)).toFixed(0)); }
  function fmtUp(s){ var d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60); return (d?d+'d ':'')+h+'h '+m+'m'; }
  function fit(){ if(!spark) return; var r=spark.getBoundingClientRect(); if(r.width){ spark.width=r.width; spark.height=r.height; } }
  function draw(){ if(!sctx||hist.length<2) return; var w=spark.width,h=spark.height; sctx.clearRect(0,0,w,h);
    var mx=Math.max(50,Math.max.apply(null,hist)),st=w/(hist.length-1),i;
    sctx.beginPath(); for(i=0;i<hist.length;i++){ var x=i*st,y=h-(hist[i]/mx)*(h-3)-2; i?sctx.lineTo(x,y):sctx.moveTo(x,y); }
    sctx.lineTo(w,h); sctx.lineTo(0,h); sctx.closePath();
    var g=sctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'rgba(0,229,255,.35)'); g.addColorStop(1,'rgba(0,229,255,0)'); sctx.fillStyle=g; sctx.fill();
    sctx.beginPath(); for(i=0;i<hist.length;i++){ var x2=i*st,y2=h-(hist[i]/mx)*(h-3)-2; i?sctx.lineTo(x2,y2):sctx.moveTo(x2,y2); }
    sctx.strokeStyle='#00daf3'; sctx.lineWidth=1.5; sctx.stroke(); }
  function poll(){ if(!(window.pywebview&&window.pywebview.api)) return;
    window.pywebview.api.stats().then(function(s){
      arc(cpuArc,s.cpu); if(cpuVal) cpuVal.innerHTML=s.cpu+'<span class="text-headline-sm">%</span>';
      arc(ramArc,s.mem); if(ramVal) ramVal.innerHTML=s.mem+'<span class="text-headline-sm">%</span>';
      if(diskVal) diskVal.innerHTML=s.disk_free+' <span class="text-outline text-body-md">GB FREE</span>';
      if(diskBar) diskBar.style.width=s.disk+'%';
      if(coresEl){ if(coresEl.children.length!==s.ncore){ coresEl.innerHTML=''; for(var i=0;i<s.ncore;i++){ var b=document.createElement('div'); b.style.width='4px'; b.style.transition='height .5s,opacity .5s'; b.className='bg-primary-container rounded-sm'; coresEl.appendChild(b);} }
        for(var j=0;j<s.cores.length;j++){ var bar=coresEl.children[j]; if(bar){ bar.style.height=Math.max(3,s.cores[j]/100*32)+'px'; bar.style.opacity=(0.35+s.cores[j]/150).toFixed(2);} } }
      if($('t-uptime')) $('t-uptime').textContent=fmtUp(s.uptime);
      if($('t-procs')) $('t-procs').textContent=s.procs;
      if($('t-load')) $('t-load').textContent=s.load;
      if($('t-swap')) $('t-swap').textContent=s.swap+'%';
      if($('t-bat')) $('t-bat').textContent=(s.bat.pct!=null?(s.bat.pct+'%'+(s.bat.plug?'⚡':'')):'AC');
      if($('t-top')) $('t-top').textContent=(s.top&&s.top.name!=='—'?s.top.name+' '+s.top.cpu+'%':'—');
      if($('net-down')) $('net-down').textContent=s.down;
      if($('net-up')) $('net-up').textContent=s.up;
      hist.push(s.down); if(hist.length>50) hist.shift(); draw();
    }).catch(function(){}); }
  function boot(){ fit(); var h=new Date().getHours(),p=h<12?'morning':h<18?'afternoon':'evening';
    jv('Good '+p+', sir. All systems online.'); box.focus(); poll(); setInterval(poll,1500); }
  window.addEventListener('resize',fit);
  if(window.pywebview&&window.pywebview.api) boot(); else window.addEventListener('pywebviewready',boot);
})();
</script>
<button id="voicebtn" class="absolute bottom-8 right-8 z-50 w-11 h-11 rounded-full border border-primary-container/40 text-primary-fixed-dim hover:text-primary-container hover:border-primary-container transition-colors flex items-center justify-center text-lg" title="Toggle J.A.R.V.I.S. voice (V)">&#128266;</button>
<script>
(function(){ var b=document.getElementById('voicebtn'); if(!b) return; var on=true;
  b.addEventListener('click',function(){ on=!on; b.innerHTML=on?'&#128266;':'&#128263;';
    if(window.pywebview&&window.pywebview.api){ window.pywebview.api.set_voice(on); } });
  document.addEventListener('keydown',function(e){ if((e.key==='v'||e.key==='V')&&document.activeElement!==document.getElementById('box')) b.click(); });
})();
</script>
