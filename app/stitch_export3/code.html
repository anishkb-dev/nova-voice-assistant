        body {

        .hud-grid {

            left: 0;

            z-index: 0;
            pointer-events: none;
        }

        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 218, 243, 0.05) 50%,
                rgba(0, 218, 243, 0.05)
            );
            background-size: 100% 4px;
            z-index: 50;
            pointer-events: none;
            opacity: 0.6;
        }

        .flicker {
            animation: flickerAnim 4s infinite alternate;
        }

        @keyframes flickerAnim {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.8; }
        }

        .hud-bracket {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #00daf3; /* primary-fixed-dim */
        }
        .bracket-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .bracket-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .bracket-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .bracket-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

        .glass-panel {
            background: rgba(12, 14, 18, 0.6); /* surface-container-lowest */
            backdrop-filter: blur(8px);
            border: 0.5px solid rgba(149, 208, 216, 0.3); /* secondary */

        }

        .glow-text {

        }

        .glow-border {
            box-shadow: 0 0 15px rgba(0, 218, 243, 0.3);
        }

        .perspective-left {
            transform: perspective(1000px) rotateY(15deg);
        }
        .perspective-right {
            transform: perspective(1000px) rotateY(-15deg);
        }
        
        .pulse {
            animation: pulseAnim 2s infinite;
        }
        @keyframes pulseAnim {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 20px rgba(0, 218, 243, 0.9); }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .ring-spin {
            animation: spin 10s linear infinite;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

<div class="absolute inset-0 w-full h-full" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_20" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_20');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
camera.position.z = 5;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Global Colors
const cyan = new THREE.Color(0x3FE0FF);

// 1. Holographic Globe (Wireframe Sphere)
const globeGeom = new THREE.SphereGeometry(2, 32, 32);
const globeMat = new THREE.MeshPhongMaterial({
  color: cyan,
  wireframe: true,
  transparent: true,
  opacity: 0.4,
  side: THREE.DoubleSide
});
const globe = new THREE.Mesh(globeGeom, globeMat);
scene.push && scene.add(globe); // Safety

// 2. Bright Glowing Core
const coreGeom = new THREE.SphereGeometry(0.3, 16, 16);
const coreMat = new THREE.MeshBasicMaterial({ color: cyan });
const core = new THREE.Mesh(coreGeom, coreMat);
globe.add(core);

// 3. Orbital Rings
function createRing(innerRadius, outerRadius, rotationX, rotationY, speed) {
  const ringGeom = new THREE.RingGeometry(innerRadius, outerRadius, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: cyan,
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.6
  });
  const ring = new THREE.Mesh(ringGeom, ringMat);
  ring.rotation.x = rotationX;
  ring.rotation.y = rotationY;
  
  // Add some wireframe/segments to the ring for tech feel
  const ringEdges = new THREE.EdgesGeometry(ringGeom);
  const ringLine = new THREE.LineSegments(ringEdges, new THREE.LineBasicMaterial({ color: cyan, opacity: 0.8 }));
  ring.add(ringLine);

  return { mesh: ring, speed };
}

const rings = [
  createRing(2.4, 2.42, Math.PI / 2.5, 0.2, 0.005),
  createRing(2.6, 2.61, -Math.PI / 3, -0.4, -0.008),
  createRing(2.2, 2.21, 0.5, 0.8, 0.01)
];

rings.forEach(r => scene.add(r.mesh));

// Lights
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(cyan, 2, 10);
pointLight.position.set(0, 0, 2);
scene.add(pointLight);

// Animation Loop
function animate(t) {
  requestAnimationFrame(animate);
  
  globe.rotation.y += 0.002;
  globe.rotation.x += 0.001;
  
  rings.forEach(r => {
    r.mesh.rotation.z += r.speed;
  });
  
  // Pulse core
  core.scale.setScalar(1 + Math.sin(t * 0.003) * 0.1);
  
  renderer.render(scene, camera);
}

animate(0);

// Resize handling
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
})();
</script>
